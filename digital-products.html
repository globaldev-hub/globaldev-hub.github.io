
<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();

  const currencySelect =
    document.getElementById("currency");

  function updateCurrency() {
    const currency = currencySelect.value;

    document.querySelectorAll(".price").forEach(price => {
      const amount = Number(
        price.dataset[currency.toLowerCase()]
      );

      if (!amount) {
        price.textContent = "Coming soon";
      } else {
        const symbol = currency === "NGN" ? "₦" : "$";

        price.textContent =
          symbol + amount.toLocaleString(
            currency === "NGN" ? "en-NG" : "en-US",
            {
              minimumFractionDigits: currency === "USD" ? 2 : 0,
              maximumFractionDigits: currency === "USD" ? 2 : 0
            }
          );
      }
    });
  }

  currencySelect.addEventListener("change", updateCurrency);
  updateCurrency();

  // TEST MODE ONLY — LIVE PAYMENT SETTINGS REMAIN UNCHANGED
  const PAYMENT_ENDPOINT =
    "https://globaldev-payments.yakubusamuel966.workers.dev/api/payments/test/initialize";

  const buyButton =
    document.getElementById("buy-cv-bundle");

  const checkoutMessage =
    document.getElementById("checkout-message");

  buyButton.addEventListener("click", async function () {
    const email = window.prompt(
      "Enter your email address for your CV Bundle purchase:"
    );

    if (email === null) return;

    const customerEmail = email.trim();

    if (
      !customerEmail ||
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customerEmail)
    ) {
      checkoutMessage.textContent =
        "Please enter a valid email address.";
      return;
    }

    const currency = currencySelect.value;

    buyButton.disabled = true;
    buyButton.textContent = "Connecting to Paystack...";
    checkoutMessage.textContent =
      "Preparing your TEST checkout. Please wait.";

    try {
      const response = await fetch(PAYMENT_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: customerEmail,
          currency: currency
        })
      });

      const result = await response.json();

      if (!response.ok || !result.authorization_url) {
        throw new Error(
          result.error || "Unable to initialize test payment."
        );
      }

      checkoutMessage.textContent =
        "Redirecting to Paystack TEST checkout...";

      window.location.assign(result.authorization_url);

    } catch (error) {
      checkoutMessage.textContent =
        error.message ||
        "Test checkout could not be started. Please try again.";

      buyButton.disabled = false;
      buyButton.textContent = "Buy Now";
    }
  });
</script>
