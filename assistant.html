<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalDev Hub AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 24px;
      background: #1b2638;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #d1d5db;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      font: inherit;
      resize: vertical;
    }

    button {
      margin: 12px 8px 12px 0;
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    #askButton {
      background: #2563eb;
      color: #ffffff;
    }

    #clearButton {
      background: #475569;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 22px;
      color: #93c5fd;
      overflow-wrap: anywhere;
    }

    #response {
      min-height: 100px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>GlobalDev Hub AI Assistant</h1>

    <p>
      Ask a question and our AI assistant will try to help.
    </p>

    <textarea
      id="question"
      placeholder="Type your message here..."
      aria-label="Your message"
    ></textarea>

    <div>
      <button id="askButton" type="button">
        Ask Assistant
      </button>

      <button id="clearButton" type="button">
        Clear
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Ready. Ask me anything.
    </p>

    <div id="response" aria-live="polite">
      The assistant's answer will appear here.
    </div>
  </main>

  <script>
    const workerUrl =
      "https://mute-frost-a9f8.yakubusamuel966.workers.dev/";

    const storageKey = "globaldevHubAssistantHistory";

    const questionBox = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const clearButton = document.getElementById("clearButton");
    const responseBox = document.getElementById("response");
    const statusBox = document.getElementById("status");

    // Restore saved conversation from this browser.
    function loadHistory() {
      try {
        const saved = localStorage.getItem(storageKey);
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed
          .filter(item =>
            item &&
            ["user", "assistant"].includes(item.role) &&
            typeof item.content === "string"
          )
          .slice(-20);
      } catch (error) {
        return [];
      }
    }

    let conversationHistory = loadHistory();

    // Save conversation after each successful answer.
    function saveHistory() {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(conversationHistory)
        );
        return true;
      } catch (error) {
        statusBox.textContent =
          "Warning: conversation could not be saved in this browser.";
        return false;
      }
    }

    // Restore the most recent answer when reopening the page.
    function restoreLastAnswer() {
      for (let i = conversationHistory.length - 1; i >= 0; i--) {
        if (conversationHistory[i].role === "assistant") {
          responseBox.textContent =
            conversationHistory[i].content;

          statusBox.textContent =
            "Previous conversation restored.";

          return;
        }
      }

      statusBox.textContent = "Ready. Ask me anything.";
    }

    restoreLastAnswer();

    async function askAssistant() {
      const question = questionBox.value.trim();

      if (!question) {
        statusBox.textContent = "Please type a message first.";
        questionBox.focus();
        return;
      }

      askButton.disabled = true;
      statusBox.textContent = "Thinking...";
      responseBox.textContent = "";

      try {
        // Send saved messages plus the new question.
        const messagesToSend = [
          ...conversationHistory,
          { role: "user", content: question }
        ].slice(-20);

        const response = await fetch(workerUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messagesToSend
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "The request failed."
          );
        }

        const answer =
          data.reply ||
          data.response ||
          data.message ||
          "The assistant returned no answer.";

        // Save the new question and answer locally.
        conversationHistory.push(
          { role: "user", content: question },
          { role: "assistant", content: answer }
        );

        conversationHistory =
          conversationHistory.slice(-20);

        responseBox.textContent = answer;
        questionBox.value = "";

        saveHistory();

        if (statusBox.textContent !==
            "Warning: conversation could not be saved in this browser.") {
          statusBox.textContent = "Answer received.";
        }

        questionBox.focus();

      } catch (error) {
        responseBox.textContent =
          "Sorry, I couldn't connect. Please try again.";

        statusBox.textContent =
          "Connection error: " + error.message;

      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener("click", askAssistant);

    clearButton.addEventListener("click", () => {
      conversationHistory = [];

      try {
        localStorage.removeItem(storageKey);
      } catch (error) {
        // Continue clearing the visible conversation.
      }

      questionBox.value = "";

      responseBox.textContent =
        "The assistant's answer will appear here.";

      statusBox.textContent = "Conversation cleared.";
      questionBox.focus();
    });

    questionBox.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        askAssistant();
      }
    });
  </script>
</body>
</html>
