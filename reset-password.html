
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b55db">
  <title>Reset Password | GlobalDev Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif; background: #f3f6fc; color: #172033;
    }
    main {
      width: 100%; max-width: 440px; padding: 28px;
      background: white; border-radius: 18px;
      box-shadow: 0 12px 40px rgba(20,45,90,.10);
    }
    .brand { text-align: center; color: #0b55db; font-size: 25px; font-weight: 800; }
    h1 { text-align: center; font-size: 25px; }
    p { color: #667085; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input {
      width: 100%; padding: 13px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 9px; background: #0b55db;
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      line-height: 1.5; overflow-wrap: anywhere;
    }
    #message:empty { display: none; }
    a { display: block; text-align: center; margin-top: 20px; color: #0b55db; }
  </style>
</head>
<body>
  <main>
    <div class="brand">G GlobalDev Hub</div>
    <h1>Reset your password</h1>
    <p>Enter a new password for your account. Use at least 8 characters.</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8"
        autocomplete="new-password" required placeholder="At least 8 characters">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8"
        autocomplete="new-password" required placeholder="Enter it again">

      <button id="resetButton" type="submit">Save New Password</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <a href="auth.html">Return to Log In</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://fkaunvoidromujlhoxow.supabase.co",
      "sb_publishable_kclbzY4IikQlKqvpEYuTuw_wLoT_fp_"
    );

    const form = document.getElementById("resetForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.background = isError ? "#fff0f0" : "#eef6ff";
      message.style.color = isError ? "#a32121" : "#174a8b";
    }

    let recoveryReady = false;

    async function prepareRecovery() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.slice(1));

      if (params.get("error") || hashParams.get("error")) {
        showMessage(
          "This recovery link may be expired or invalid. Return to Log In and request a new one.",
          true
        );
        resetButton.disabled = true;
        return;
      }

      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        showMessage(
          "Open this page using the password recovery link sent to your email. If the link has expired, request a new one.",
          true
        );
        resetButton.disabled = true;
        return;
      }

      recoveryReady = true;
      showMessage("Recovery link verified. You can choose a new password.");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage("Please open a valid recovery link from your email first.", true);
        return;
      }

      if (newPassword.value.length < 8) {
        showMessage("Your password must contain at least 8 characters.", true);
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        showMessage("The passwords do not match. Please try again.", true);
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Saving…";

      try {
        const { error } = await supabase.auth.updateUser({
          password: newPassword.value
        });

        if (error) throw error;

        showMessage("Password updated successfully. Return to Log In and sign in with your new password.");
        form.reset();
        recoveryReady = false;
        await supabase.auth.signOut();
      } catch (error) {
        showMessage(error.message || "Could not update your password. Request a new recovery link if necessary.", true);
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Save New Password";
      }
    });

    prepareRecovery();
  </script>
</body>
</html>
