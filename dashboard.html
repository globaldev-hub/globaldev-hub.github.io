<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b55db">
<meta name="description" content="Your GlobalDev Hub member dashboard.">
<title>My Dashboard | GlobalDev Hub</title>
<style>
*{box-sizing:border-box}
:root{--blue:#0b55db;--dark:#172033;--muted:#667085;--border:#e2e8f0;--bg:#f4f7fc}
body{margin:0;font-family:Arial,sans-serif;color:var(--dark);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar{max-width:1120px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{color:var(--blue);font-size:21px;font-weight:800;text-decoration:none}
button,.button{border:0;border-radius:9px;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:white}
.secondary{background:#eaf0fb;color:var(--dark)}
button:disabled{opacity:.6;cursor:wait}
.layout{max-width:1120px;margin:26px auto;padding:0 18px 35px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}
aside,.panel{background:#fff;border:1px solid var(--border);border-radius:15px}
aside{padding:17px;align-self:start}
.nav-title{margin:5px 8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.nav-link{display:block;padding:12px;margin:4px 0;border-radius:8px;color:#344054;text-decoration:none;font-weight:600}
.nav-link:hover,.nav-link.active{background:#edf3ff;color:var(--blue)}
main{min-width:0}
.welcome{padding:27px;border-radius:16px;color:white;background:linear-gradient(125deg,#0b55db,#347cf3)}
.welcome .eyebrow{margin:0 0 8px;opacity:.9;font-size:13px}
.welcome h1{margin:0 0 10px;font-size:clamp(25px,4vw,34px);overflow-wrap:anywhere}
.welcome p{margin:0;line-height:1.7;max-width:650px}
.section-heading{margin:27px 0 13px;font-size:21px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.panel{padding:20px}
.panel h3{margin:0 0 10px;font-size:18px}
.panel p{color:var(--muted);line-height:1.65;margin:0 0 15px;overflow-wrap:anywhere}
.profile-icon{width:90px;height:90px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#eaf1ff;color:var(--blue);font-size:32px;font-weight:800;margin-bottom:13px}
.profile-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
label{display:block;font-weight:700;margin:14px 0 7px}
input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;font-family:Arial,sans-serif}
input:focus,textarea:focus{outline:2px solid #a9c7ff;border-color:var(--blue)}
.email{overflow-wrap:anywhere;font-weight:600;color:var(--dark)!important}
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}
#status{padding:35px 10px;text-align:center;color:var(--muted)}
#notice{padding:12px;border-radius:8px;line-height:1.6;overflow-wrap:anywhere;margin:15px 0}
#notice:empty{display:none}
#chatMessages{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.chat-bubble{padding:14px;border-radius:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.chat-user{background:#f1f5f9}
.chat-ai{background:#edf3ff}
.chat-bubble p{margin:6px 0 0;color:#344054;white-space:pre-wrap}
#question{min-height:100px;resize:vertical}
#aiImagePreview{display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin:8px 0}
[hidden]{display:none!important}
footer{text-align:center;color:var(--muted);padding:20px;font-size:13px}
@media(max-width:700px){
.layout{grid-template-columns:1fr;margin-top:16px}
aside{display:flex;flex-wrap:wrap;gap:4px}
.nav-title{width:100%}
.nav-link{padding:10px;font-size:14px}
.cards{grid-template-columns:1fr}
.welcome{padding:22px}
.topbar{padding:13px 15px}
.brand{font-size:18px}
}
</style>
</head>
