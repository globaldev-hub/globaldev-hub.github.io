
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b55db">
<meta name="description" content="Private GlobalDev Hub advertiser management.">
<title>Advertiser Management | GlobalDev Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
}

header {
  background: #0b55db;
  color: white;
  padding: 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: .9;
}

button, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.header-button {
  background: white;
  color: #0b55db;
  border: 0;
  border-radius: 7px;
  padding: 10px 15px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 14px rgba(0,0,0,.05);
}

.panel h2 {
  margin-top: 0;
  font-size: 19px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.stat {
  background: #f4f7fc;
  border-radius: 9px;
  padding: 17px;
}

.stat span {
  display: block;
  color: #667085;
  font-size: 13px;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
  color: #0b55db;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.toolbar select,
.status-select {
  padding: 9px;
  border: 1px solid #d5dce8;
  border-radius: 7px;
  background: white;
}

.refresh-button {
  background: #0b55db;
  color: white;
  border: 0;
  padding: 10px 15px;
  border-radius: 7px;
}

#message {
  padding: 12px;
  border-radius: 7px;
  background: #eef4ff;
  color: #1647a3;
  margin-bottom: 15px;
  display: none;
  overflow-wrap: anywhere;
}

#message.error {
  background: #fff0f0;
  color: #b42318;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  padding: 13px 10px;
  text-align: left;
  border-bottom: 1px solid #edf0f5;
  vertical-align: top;
  font-size: 13px;
}

th {
  background: #f7f9fc;
  color: #475467;
}

td strong {
  display: block;
  margin-bottom: 5px;
}

td a {
  color: #0b55db;
  overflow-wrap: anywhere;
}

.message-cell {
  white-space: pre-wrap;
  min-width: 180px;
  max-width: 260px;
  overflow-wrap: anywhere;
}

.status-select {
  min-width: 120px;
}

.empty {
  text-align: center;
  color: #667085;
  padding: 30px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #667085;
  font-size: 13px;
}

@media (max-width: 650px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .panel {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>G GlobalDev Hub</h1>
      <p>Private Advertiser Management</p>
    </div>

    <button class="header-button" id="logoutButton">
      Log Out
    </button>
  </div>
</header>

<main>

  <section class="panel">
    <h2>Advertising Overview</h2>

    <div class="stats">
      <div class="stat">
        <span>Total inquiries</span>
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        <span>New</span>
        <strong id="newCount">0</strong>
      </div>

      <div class="stat">
        <span>Reviewing</span>
        <strong id="reviewingCount">0</strong>
      </div>

      <div class="stat">
        <span>Approved</span>
        <strong id="approvedCount">0</strong>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Advertiser Inquiries</h2>

    <div id="message"></div>

    <div class="toolbar">
      <select id="statusFilter">
        <option value="all">All inquiries</option>
        <option value="new">New</option>
        <option value="reviewing">Reviewing</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>

      <button class="refresh-button" id="refreshButton">
        Refresh Inquiries
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Advertiser</th>
            <th>Company</th>
            <th>Package</th>
            <th>Budget</th>
            <th>Message</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="inquiriesBody">
          <tr>
            <td colspan="7" class="empty">
              Checking administrator access...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<footer>
  GlobalDev Hub · Private Administration
</footer>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://fkaunvoidromujlhoxow.supabase.co";

const SUPABASE_PUBLIC_KEY =
"sb_publishable_kclbzY4IikQlKqvpEYuTuw_wLoT_fp_";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLIC_KEY
);

const body = document.getElementById("inquiriesBody");
const messageBox = document.getElementById("message");
const statusFilter = document.getElementById("statusFilter");

let inquiries = [];

function showMessage(message, error = false) {
  messageBox.textContent = message;
  messageBox.className = error ? "error" : "";
  messageBox.style.display = "block";
}

function hideMessage() {
  messageBox.style.display = "none";
}

function addTextCell(row, value, className = "") {
  const cell = document.createElement("td");
  cell.textContent = value || "—";

  if (className) {
    cell.className = className;
  }

  row.appendChild(cell);
  return cell;
}

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "—";

  return date.toLocaleString();
}

function updateStatistics() {
  document.getElementById("totalCount").textContent =
    inquiries.length;

  document.getElementById("newCount").textContent =
    inquiries.filter(item => item.status === "new").length;

  document.getElementById("reviewingCount").textContent =
    inquiries.filter(item => item.status === "reviewing").length;

  document.getElementById("approvedCount").textContent =
    inquiries.filter(item => item.status === "approved").length;
}

function renderInquiries() {
  body.replaceChildren();

  const selectedStatus = statusFilter.value;

  const filtered = selectedStatus === "all"
    ? inquiries
    : inquiries.filter(item => item.status === selectedStatus);

  if (!filtered.length) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 7;
    cell.className = "empty";
    cell.textContent = "No inquiries found.";

    row.appendChild(cell);
    body.appendChild(row);
    return;
  }

  filtered.forEach(item => {
    const row = document.createElement("tr");

    const advertiserCell = document.createElement("td");

    const name = document.createElement("strong");
    name.textContent = item.name || "Unnamed advertiser";
    advertiserCell.appendChild(name);

    const email = document.createElement("a");
    email.textContent = item.email || "No email";
    if (item.email) {
      email.href = "mailto:" + item.email;
    }
    advertiserCell.appendChild(email);

    row.appendChild(advertiserCell);

    addTextCell(
      row,
      [item.company, item.website, item.country]
        .filter(Boolean).join("\n")
    );

    addTextCell(
      row,
      [item.package, item.advertising_type]
        .filter(Boolean).join(" · ")
    );

    addTextCell(row, item.budget);

    addTextCell(row, item.message, "message-cell");

    addTextCell(row, formatDate(item.created_at));

    const statusCell = document.createElement("td");
    const select = document.createElement("select");

    select.className = "status-select";

    ["new", "reviewing", "approved", "rejected"]
      .forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent =
          status.charAt(0).toUpperCase() + status.slice(1);
        select.appendChild(option);
      });

    select.value = item.status || "new";

    select.addEventListener("change", async () => {
      await updateStatus(item.id, select.value, select);
    });

    statusCell.appendChild(select);
    row.appendChild(statusCell);

    body.appendChild(row);
  });
}

async function updateStatus(id, newStatus, select) {
  hideMessage();
  select.disabled = true;

  const { error } = await supabase
    .from("advertiser_inquiries")
    .update({ status: newStatus })
    .eq("id", id);

  select.disabled = false;

  if (error) {
    showMessage(
      "Could not update inquiry status: " + error.message,
      true
    );

    await loadInquiries();
    return;
  }

  showMessage("Inquiry status updated successfully.");

  const inquiry = inquiries.find(item => item.id === id);

  if (inquiry) {
    inquiry.status = newStatus;
  }

  updateStatistics();
  renderInquiries();
}

async function loadInquiries() {
  hideMessage();

  body.replaceChildren();

  const loadingRow = document.createElement("tr");
  const loadingCell = document.createElement("td");

  loadingCell.colSpan = 7;
  loadingCell.className = "empty";
  loadingCell.textContent = "Loading advertiser inquiries...";

  loadingRow.appendChild(loadingCell);
  body.appendChild(loadingRow);

  const { data, error } = await supabase
    .from("advertiser_inquiries")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage(
      "Unable to load inquiries: " + error.message,
      true
    );
    return;
  }

  inquiries = data || [];

  updateStatistics();
  renderInquiries();
}

async function initialize() {
  const {
    data: { session },
    error: sessionError
  } = await supabase.auth.getSession();

  if (sessionError || !session) {
    window.location.replace("auth.html");
    return;
  }

  const { data: adminRecord, error: adminError } =
    await supabase
      .from("admin_users")
      .select("user_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

  if (adminError || !adminRecord) {
    document.body.replaceChildren();

    const denied = document.createElement("h2");
    denied.textContent =
      "Access denied. Administrator permission is required.";

    denied.style.cssText =
      "padding:40px;text-align:center;color:#b42318";

    document.body.appendChild(denied);
    return;
  }

  await loadInquiries();
}

document.getElementById("refreshButton")
  .addEventListener("click", loadInquiries);

statusFilter.addEventListener("change", renderInquiries);

document.getElementById("logoutButton")
  .addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.replace("auth.html");
  });

initialize();
</script>

</body>
</html>
